name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: prod_schedule/.python-version
          cache: pip
          cache-dependency-path: prod_schedule/requirements.txt
      - run: pip install -r prod_schedule/requirements.txt pytest
      - run: pytest
        working-directory: prod_schedule
