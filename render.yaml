services:
  - type: web
    name: prod-schedule
    env: python
    rootDir: prod_schedule
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
    autoDeploy: true
