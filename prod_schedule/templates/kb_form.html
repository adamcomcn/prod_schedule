{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page">
<div style="max-width:760px; margin:0 auto;">

  <div style="margin-bottom:16px;">
    <a href="{{ url_for('knowledge') }}" style="font-size:.85rem; color:#6b7280;">
      &#8592; 返回知识库
    </a>
  </div>

  <div class="card">
    <div class="card-title">{{ title }}</div>
    <form method="POST">
      <div class="form-group">
        <label>标题 <span style="color:#dc2626;">*</span></label>
        <input type="text" name="title" required
               value="{{ article.title if article else '' }}"
               placeholder="如：A01 — Assembly Issues">
      </div>
      <div class="form-group">
        <label>分类</label>
        <select name="category_id">
          <option value="">— 选择分类 —</option>
          {% for c in cats %}
          <option value="{{ c.id }}"
            {{ 'selected' if article and article.category_id == c.id }}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>标签 <span style="font-size:.75rem; color:#6b7280;">（逗号分隔，如 A01,Assembly）</span></label>
        <input type="text" name="tags"
               value="{{ article.tags if article else '' }}"
               placeholder="A01, Assembly, valve">
      </div>
      <div class="form-group">
        <label>内容 <span style="color:#dc2626;">*</span></label>
        <textarea name="content" rows="12" required
                  placeholder="文章内容，可描述缺陷定义、检验标准、案例说明等..."
                  style="font-family:inherit;">{{ article.content if article else '' }}</textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('knowledge') }}" class="btn btn-outline">取消</a>
      </div>
    </form>
  </div>

</div>
</div>
{% endblock %}
