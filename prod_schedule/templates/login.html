<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Production Schedule</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
       background: #f0f2f5; min-height: 100vh;
       display: flex; align-items: center; justify-content: center; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1);
        padding: 40px 36px; width: 100%; max-width: 360px; }
.brand { font-size: 1.1rem; font-weight: 700; color: #1a3a5c; margin-bottom: 6px; }
.subtitle { font-size: .85rem; color: #6b7280; margin-bottom: 28px; }
label { display: block; font-size: .85rem; font-weight: 500; color: #374151; margin-bottom: 6px; }
input { width: 100%; border: 1px solid #d0d5dd; border-radius: 6px;
        padding: 10px 12px; font-size: .9rem; outline: none;
        transition: border-color .15s, box-shadow .15s; margin-bottom: 16px; }
input:focus { border-color: #1a6fc4; box-shadow: 0 0 0 3px rgba(26,111,196,.12); }
button { width: 100%; background: #1a6fc4; color: #fff; border: none;
         border-radius: 6px; padding: 11px; font-size: .95rem; font-weight: 600;
         cursor: pointer; transition: background .15s; margin-top: 4px; }
button:hover { background: #155fa0; }
.alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px;
         font-size: .85rem; background: #fee2e2; color: #991b1b;
         border: 1px solid #fca5a5; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Production Schedule</div>
  <div class="subtitle">请登录以继续 / Sign in to continue</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label for="username">用户名 / Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>
    <label for="password">密码 / Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">登录 / Login</button>
  </form>
</div>
</body>
</html>
